[package]
name = "commandagi"
version = "0.1.0"
edition = "2021"
description = "The CommandAGI SDK for Rust: CommandAGI documents (a schematic sheet, …) declared as code that is their source of truth."
license = "MIT"
repository = "https://github.com/CommandAGI/commandagi-sdk-rust"
# No dependencies, no build script, no proc-macros: the local host compiles a document's `.rs` file against this crate
# alone, offline (docs/code-sandbox.md in the CommandAGI repository).

[lib]
path = "src/lib.rs"

[workspace]
