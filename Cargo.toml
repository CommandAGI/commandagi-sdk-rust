[package]
name = "commandagi"
version = "0.6.10"
edition = "2021"
description = "The CommandAGI SDK for Rust: the platform client (agent threads, live sessions on a simulated world) and CommandAGI documents (a schematic, a 3D part …) declared as code. No dependencies."
license = "MIT"
repository = "https://github.com/CommandAGI/commandagi-sdk-rust"
readme = "README.md"
homepage = "https://commandagi.com"
documentation = "https://docs.rs/commandagi"
keywords = ["commandagi", "robotics", "simulation", "cad", "sdk"]
categories = ["api-bindings", "simulation", "science::robotics"]
# The source map is a crate of its own (map/, with its vendored parser): not part of this one.
exclude = ["map/"]
# No dependencies, no build script, no proc-macros: the local host compiles a document's `.rs` file against this crate
# alone, offline (docs/code-sandbox.md in the CommandAGI repository).

[package.metadata.docs.rs]
# Nothing to enable: the crate has no features and no dependencies, so docs.rs builds it as it is.
targets = ["x86_64-unknown-linux-gnu"]

[lib]
path = "src/lib.rs"

[workspace]
