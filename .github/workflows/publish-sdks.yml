# Publish `commandagi` on crates.io by TRUSTED PUBLISHING (OIDC): no token is stored anywhere. crates.io's trusted
# publisher for this crate names this repository and this file (publish-sdks.yml), environment empty (set 2026-11-24).
# 0.6.10, the first version, was published with a token: crates.io sets up trusted publishing only for a crate that exists.
#
# Manual: run it on the release's tag after `make sdk-check` passed in the CommandAGI repository
# (docs/deploy.md § releasing the SDKs). GitHub Actions costs money, so nothing runs it on a push.
name: publish
on:
  workflow_dispatch:
    inputs:
      tag:
        description: the release's tag, v<version>
        required: true
permissions:
  contents: read
jobs:
  crate:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo test --locked
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
